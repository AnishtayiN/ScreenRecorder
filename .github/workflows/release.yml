name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd windows
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd windows
          pyinstaller --onefile --noconsole --name ScreenRecorder --icon=NUL screen_recorder.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/ScreenRecorder.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Screen Recorder ${{ github.ref_name }}"
          body: |
            ## 🎬 Screen Recorder ${{ github.ref_name }}
            
            ### 🪟 Windows (7 - 11)
            - Download `ScreenRecorder.exe`
            - No installation needed, just run it
            - Requirements: Windows 7 or later
            
            ### 📱 Android (7.0+)
            - Download `app-debug.apk`
            - Enable "Install from Unknown Sources" in settings
            - Requires Android 7.0 (API 24) or later
            
            ### Features
            - 🎥 Full screen & custom region recording
            - ⏸ Pause/Resume functionality
            - 📷 Screenshot capture (Windows)
            - ⌨ Global hotkeys (F9/F10/F11)
            - 🎚 FPS, quality & format settings
            - 🔔 System tray support (Windows)
            - 📱 Floating notification controls (Android)
            
            ### Hotkeys (Windows)
            - **F9** — Start/Stop recording
            - **F10** — Pause/Resume
            - **F11** — Take screenshot
          files: |
            artifacts/windows/ScreenRecorder.exe
            artifacts/android/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
