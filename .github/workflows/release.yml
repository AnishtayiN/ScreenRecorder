name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd windows
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Update version in source
        shell: pwsh
        run: |
          $ver = "${{ inputs.version || github.ref_name }}"
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          $file = "windows/screen_recorder.py"
          $content = Get-Content $file -Raw
          $content = $content -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$ver`""
          Set-Content $file $content
          Write-Host "Version set to $ver"

      - name: Build EXE
        run: |
          cd windows
          pyinstaller --onefile --noconsole --name ScreenRecorder screen_recorder.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/ScreenRecorder.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Update version in build.gradle
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          VER="${VER#v}"
          MAJOR=$(echo $VER | cut -d. -f1)
          MINOR=$(echo $VER | cut -d. -f2)
          PATCH=$(echo $VER | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "Version set to $VER (code: $VERSION_CODE)"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Upload Android Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Android Release APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: artifacts/android-release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Screen Recorder ${{ steps.version.outputs.name }}"
          body: |
            ## Screen Recorder ${{ steps.version.outputs.name }}
            
            ### Windows (7 - 11)
            - Download `ScreenRecorder.exe`
            - No installation needed, just run it
            - Requirements: Windows 7 or later
            
            ### Android (7.0+)
            - Download `app-debug.apk` (Debug - easier to install)
            - Enable "Install from Unknown Sources" in settings
            - Requires Android 7.0 (API 24) or later
            
            ### Features
            - Full screen and custom region recording
            - Pause/Resume functionality
            - Screenshot capture (Windows)
            - Global hotkeys (F9/F10/F11)
            - FPS, quality and format settings
            - System tray support (Windows)
            - Notification controls (Android)
            
            ### Hotkeys (Windows)
            - **F9** - Start / Stop recording
            - **F10** - Pause / Resume
            - **F11** - Take screenshot
          files: |
            artifacts/windows/ScreenRecorder.exe
            artifacts/android/app-debug.apk
            artifacts/android-release/app-release-unsigned.apk
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
